# pyproject.toml

[project]
name = "pyguidos" 
version = "2.2.0"
authors = [
  { name="Giovanni Caudullo", email="giovanni.caudullo@ext.ec.europa.eu" },
  { name="Peter Vogt", email="peter.vogt@ec.europa.eu" },
]
description = "Python interface to GuidosToolbox (GTB) for spatial pattern analysis"
readme = "README.md" 
license = {text = "EUPL-1.2"}
requires-python = ">=3.10"
keywords = [
    "landscape analysis",
    "spatial pattern",
    "GIS",
    "remote sensing",
    "forest",
    "habitat",
    "connectivity",
    "fragmentation",
    "MSPA",
    "GuidosToolbox"
] 
classifiers = [
    "Development Status :: 3 - Alpha", 
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "scipy>=1.15",
    "scikit-image>=0.26.0",
    "matplotlib>=3.10.9",
    "pyogrio>=0.10",
    "geopandas>=1.1.0",
    "shapely>=2.0.7",
    "pyproj>=3.4",
    "python-ternary>=1.0.8",
    "numba>=0.62",
    "tbb>=2021.6.0; sys_platform == 'win32'",
    "intel-openmp; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://code.europa.eu/jrc-forest/guidos/pyguidos"
Documentation = "https://jrc-forest.pages.code.europa.eu/guidos/pyguidos/"
"Bug Tracker" = "https://code.europa.eu/jrc-forest/guidos/pyguidos/-/issues"

[project.optional-dependencies]
notebooks = [
    "pandas>=2.0",
    "jupyterlab>=4.0",
]
test = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["pyguidos*"]

[tool.setuptools.package-data]
pyguidos = [
    "progs/*",
    "templates/*",
    "data/*",
]

[build-system]
requires = ["setuptools>=61.0"]  
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--strict-markers -s -v"
testpaths = [
    "tests",
]
python_files = "test_*.py"

[project.scripts]
pyguidos-setup = "pyguidos.setup_cli:configure_workspace"
