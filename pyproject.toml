# pyproject.toml

[project]
name = "pyguidos" 
version = "2.0.0.dev1"
authors = [
  { name="Giovanni Caudullo", email="giovanni.caudullo@ext.ec.europa.eu" },
  { name="Peter Vogt", email="peter.vogt@ec.europa.eu" },
]
description = "Python interface to GuidosToolbox (GTB) for spatial pattern analysis"
readme = "README.md" 
license = {text = "EUPL-1.2"}
requires-python = ">=3.8" 
keywords = [
    "landscape analysis",
    "spatial pattern",
    "GIS",
    "remote sensing",
    "habitat",
    "fragmentation",
    "MSPA",
    "GuidosToolbox"
] 
classifiers = [
    "Development Status :: 3 - Alpha", 
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "fiona>=1.9",
    "shapely>=2.0",
    "pyproj>=3.4",
    "python-ternary>=1.0",
]

[project.urls]
Homepage = "https://code.europa.eu/jrc-forest/guidos/pyguidos"
Documentation = "https://jrc-forest.pages.code.europa.eu/guidos/pyguidos/"
"Bug Tracker" = "https://code.europa.eu/jrc-forest/guidos/pyguidos/-/issues"

[project.optional-dependencies]
notebooks = [
    "pandas>=2.0",
    "jupyterlab>=4.0",
]
test = [
    "pytest>=6.0",
    "pytest-mock>=3.0",
]

[tool.setuptools.packages.find]
include = ["pyguidos*"]

[tool.setuptools.package-data]
pyguidos = [
    "progs/*",
    "templates/*",
    "work/",
    "data/*",
]

[build-system]
requires = ["setuptools>=61.0"]  
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--strict-markers -s -v"
testpaths = [
    "tests",
]
python_files = "test_*.py"


