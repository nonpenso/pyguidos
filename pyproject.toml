# pyproject.toml

[project]
name = "pyguidos" 
version = "2.6.3"
authors = [
  { name="Giovanni Caudullo", email="giovanni.caudullo@ext.ec.europa.eu" },
  { name="Peter Vogt", email="peter.vogt@ec.europa.eu" },
]
description = "Python interface to main GuidosToolbox (GTB) modules for spatial pattern analysis"
readme = "README.md" 
license = "GPL-3.0-or-later"
license-file = ["LICENSE*"]
requires-python = ">=3.10"
keywords = [
    "landscape analysis",
    "spatial pattern",
    "GIS",
    "remote sensing",
    "forest",
    "habitat",
    "connectivity",
    "fragmentation",
    "MSPA",
    "GuidosToolbox"
] 
classifiers = [
    "Development Status :: 3 - Alpha", 
    "Intended Audience :: Science/Research",
    "License :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "scipy>=1.15",
    "scikit-image>=0.24.0",
    "matplotlib>=3.10",
    "pyogrio>=0.10",
    "geopandas>=1.1.0",
    "shapely>=2.0.7",
    "python-ternary>=1.0.8",
    "numba>=0.62",
    "tbb>=2021.6.0; sys_platform == 'win32'" and platform_machine == 'AMD64',
    "intel-openmp; sys_platform == 'linux' and platform_machine == 'x84_64'",
]

[project.urls]
Homepage = "https://code.europa.eu/jrc-forest/guidos/pyguidos"
Documentation = "https://jrc-forest.pages.code.europa.eu/guidos/pyguidos/"
"Bug Tracker" = "https://code.europa.eu/jrc-forest/guidos/pyguidos/-/issues"

[project.optional-dependencies]
notebooks = [
    "pandas>=2.0",
    "jupyterlab>=4.0",
]
test = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["pyguidos*"]

[tool.setuptools.package-data]
pyguidos = [
    "progs/*",
    "templates/*",
    "data/*",
]
# Vendored MSPA C sources/headers, shipped in the sdist so the extension can
# be built from source on platforms without a prebuilt wheel.
"pyguidos._mspa" = [
    "bridge.c",
    "miallib/*.c",
    "miallib/*.h",
]

[build-system]
# numpy is required at build time to compile the _mspa C extension against
# the NumPy C-API headers. It must satisfy the runtime numpy>=2.0 pin.
requires = ["setuptools>=77", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--strict-markers -s -v"
testpaths = [
    "tests",
]
python_files = "test_*.py"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*"
enable = ["cpython-freethreading"]
skip = "*-musllinux_*"
build-frontend = "build"
test-requires = "numpy>=2.0"
test-command = "python -c \"from pyguidos._mspa import _mspa; assert hasattr(_mspa, 'mspa')\""

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.linux]
archs = ["native"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]