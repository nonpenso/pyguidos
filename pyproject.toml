# pyproject.toml

[project]
name = "pyguidos" 
version = "2.6.0"
authors = [
  { name="Giovanni Caudullo", email="giovanni.caudullo@ext.ec.europa.eu" },
  { name="Peter Vogt", email="peter.vogt@ec.europa.eu" },
]
description = "Python interface to main GuidosToolbox (GTB) modules for spatial pattern analysis"
readme = "README.md" 
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
keywords = [
    "landscape analysis",
    "spatial pattern",
    "GIS",
    "remote sensing",
    "forest",
    "habitat",
    "connectivity",
    "fragmentation",
    "MSPA",
    "GuidosToolbox"
] 
classifiers = [
    "Development Status :: 3 - Alpha", 
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "scipy>=1.15",
    "scikit-image>=0.26.0",
    "matplotlib>=3.10",
    "pyogrio>=0.10",
    "geopandas>=1.1.0",
    "shapely>=2.0.7",
    "python-ternary>=1.0.8",
    "numba>=0.62",
    "tbb>=2021.6.0; sys_platform == 'win32'",
    "intel-openmp; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://code.europa.eu/jrc-forest/guidos/pyguidos"
Documentation = "https://jrc-forest.pages.code.europa.eu/guidos/pyguidos/"
"Bug Tracker" = "https://code.europa.eu/jrc-forest/guidos/pyguidos/-/issues"

[project.optional-dependencies]
notebooks = [
    "pandas>=2.0",
    "jupyterlab>=4.0",
]
test = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["pyguidos*"]

[tool.setuptools.package-data]
pyguidos = [
    "progs/*",
    "templates/*",
    "data/*",
]
# Vendored MSPA C sources/headers, shipped in the sdist so the extension can
# be built from source on platforms without a prebuilt wheel.
"pyguidos._mspa" = [
    "bridge.c",
    "miallib/*.c",
    "miallib/*.h",
]

[build-system]
# numpy is required at build time to compile the _mspa C extension against
# the NumPy C-API headers. It must satisfy the runtime numpy>=2.0 pin.
requires = ["setuptools>=61.0", "wheel", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--strict-markers -s -v"
testpaths = [
    "tests",
]
python_files = "test_*.py"

[tool.cibuildwheel]
# Target the lab platforms: Windows x64, Linux x86_64 + ARM64, and
# macOS Intel + Apple Silicon. Build CPython 3.10-3.14 only; skip 32-bit,
# musllinux, exotic archs and PyPy (the C extension targets 64-bit CPython).
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-manylinux_i686 *_ppc64le *_s390x *-musllinux_* pp*"
build-frontend = "build"
# Smoke-test each built wheel by importing ONLY the compiled extension (its
# sole dependency is numpy), so the test does not require the full pyGuidos
# scientific stack to resolve on every target.
test-requires = "numpy>=2.0"
test-command = "python -c \"from pyguidos._mspa import _mspa; assert hasattr(_mspa, 'mspa')\""

[tool.cibuildwheel.macos]
# universal2 wheels run on both Intel and Apple Silicon Macs from one wheel.
archs = ["universal2"]
# universal2 wheels can't run their embedded arch on an x86 runner, so skip
# the on-runner test for the cross-built slice (build validity is unaffected).
test-skip = "*universal2:arm64"

[tool.cibuildwheel.linux]
# x86_64 builds natively; aarch64 (ARM64) is built via QEMU emulation, which
# CI registers with `docker run --privileged tonistiigi/binfmt` before build.
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
