image: python:3.11-slim

stages:
  - test
  - deploy

# Global cache to speed up pip installs
cache:
  key: pip-cache
  paths:
    - .pip-cache/

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

# 1. Run Tests and calculate coverage
run_tests:
  stage: test
  tags:
    - shared-docker
  script:
    - apt-get update && apt-get install -y libexpat1 libgomp1
    - pip install --upgrade pip
    - pip install pytest pytest-cov . 
    - python -m pytest --cov=pyguidos tests/ --cov-report term-missing --cov-report html
  coverage: '/(?i)total.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)/'
  artifacts:
    when: always
    paths:
       - htmlcov/
    expire_in: 1 week
  only:
    refs:
       - develop-v2
    changes:
       - "pyguidos/**/*"
       - "tests/**/*"

# 2. Build and Deploy Documentation (GitLab Pages)
pages:
  stage: deploy
  tags:
    - shared-docker
  dependencies:
    - run_tests
  script:
    - apt-get update && apt-get install -y libexpat1
    - pip install --upgrade pip
    - pip install sphinx pydata-sphinx-theme .
    - sphinx-build -b html docs public
    - |
      if [ -d "htmlcov" ]; then
        echo "? New coverage found in current pipeline. Using it."
        mkdir -p public/coverage
        cp -r htmlcov/* public/coverage/
      else
        echo "? Tests skipped. Attempting to fetch coverage from last successful develop-v2 pipeline..."
        curl --location --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/download?job=run_tests" \
          -o artifacts.zip || echo "? Download failed."
        
        if [ -f "artifacts.zip" ]; then
          unzip -o artifacts.zip
          if [ -d "htmlcov" ]; then
            mkdir -p public/coverage
            cp -r htmlcov/* public/coverage/
            echo "? Success: Persistent coverage restored."
          else
            echo "? htmlcov folder not found in the downloaded zip."
          fi
        else
          echo "Warning: Could not restore coverage. Site will be built without it."
        fi
      fi
  artifacts:
    paths:
      - public
  only:
    - develop-v2