image: python:3.11-slim

stages:
  - test
  - deploy

cache:
  - key: pip-cache
    paths:
      - .pip-cache/
  - key: coverage-fixed-key 
    paths:
      - htmlcov/

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

# 1. Run Tests and calculate coverage
run_tests:
  stage: test
  image: python:3.12
  tags:
    - shared-docker
  variables:
    NUMBA_DISABLE_JIT: "1"
  script:
    # gcc is required to compile the _mspa C extension from source.
    - apt-get update && apt-get install -y build-essential libexpat1 libgomp1
    - pip install --upgrade pip
    - pip install pytest pytest-cov
    - pip install ".[test]"
    # pytest runs from the repo root and imports pyguidos from the SOURCE tree
    # (./pyguidos/), which shadows the installed wheel. The source tree ships
    # only the C sources, not the compiled extension, so we must compile the
    # _mspa extension in place. `build_ext --inplace` drops the Linux .so into
    # ./pyguidos/_mspa/ so the imported source package has a working extension.
    - pip install numpy setuptools wheel
    - python setup.py build_ext --inplace
    - python -m pytest --cov=pyguidos tests/ --cov-report term-missing --cov-report html
  coverage: '/(?i)total.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)/'
  artifacts:
    when: always
    paths:
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always

# 2. Build and Deploy Documentation (GitLab Pages)
pages:
  stage: deploy
  image: python:3.12
  tags:
    - shared-docker
  needs:
    - job: run_tests
      artifacts: true  # Explicitly tell GitLab to bring the htmlcov folder over
      optional: true
  script:
    # build-essential is required to compile the _mspa C extension on install.
    - apt-get update && apt-get install -y build-essential libexpat1
    - pip install --upgrade pip
    - pip install sphinx pydata-sphinx-theme ".[notebooks,test]"
    # Compile the _mspa extension in place so that importing pyguidos from the
    # source tree during the docs build finds the extension (same source-tree
    # shadowing reason as the run_tests job).
    - pip install numpy setuptools wheel
    - python setup.py build_ext --inplace
    - sphinx-build -b html docs public
    - |
      if [ -d "htmlcov" ]; then
        echo "Coverage data found. Moving to public/coverage..."
        mkdir -p public/coverage
        cp -rf htmlcov/* public/coverage/
      else
        echo "ERROR: htmlcov directory not found in current workspace!"
        ls -la  
        exit 1  
      fi
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always