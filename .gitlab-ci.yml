image: python:3.11-slim

stages:
  - test
  - deploy

# Global cache to speed up pip installs
cache:
  key: pip-cache
  paths:
    - .pip-cache/

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

# 1. Run Tests and calculate coverage
run_tests:
  stage: test
  tags:
    - shared-docker
  script:
    - apt-get update && apt-get install -y libexpat1 libgomp1
    - pip install --upgrade pip
    - pip install pytest pytest-cov . 
    - python -m pytest --cov=pyguidos tests/ --cov-report term-missing --cov-report html
  coverage: '/(?i)total.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)/'
  artifacts:
    when: always
    paths:
       - htmlcov/
    expire_in: 1 week
  only:
    refs:
       - develop-v2
    changes:
       - "pyguidos/**/*"
       - "tests/**/*"

# 2. Build and Deploy Documentation (GitLab Pages)
pages:
  stage: deploy
  tags:
    - shared-docker
  dependencies:
    - run_tests
  script:
    - apt-get update && apt-get install -y curl unzip libexpat1
    - pip install --upgrade pip
    - pip install sphinx pydata-sphinx-theme .
    - sphinx-build -b html docs public
    - |
      if [ -d "htmlcov" ]; then
        echo "New coverage found."
        mkdir -p public/coverage
        cp -r htmlcov/* public/coverage/
      else
        echo "Tests skipped. Trying to fetch last successful artifacts..."
        # Using the specific 'latest' successful job endpoint
        curl --location --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/download?job=run_tests" \
          -o artifacts.zip
        
        # Check if the file is actually a ZIP (greater than 500 bytes)
        if [ -f "artifacts.zip" ] && [ $(stat -c%s "artifacts.zip") -gt 500 ]; then
          unzip -o artifacts.zip
          mkdir -p public/coverage
          cp -r htmlcov/* public/coverage/ || echo "Folder missing in zip"
          echo "Success: Coverage restored."
        else
          echo "Artifact download failed or returned an error message. Creating empty folder to prevent crash."
          mkdir -p public/coverage
          echo "<html><body><h1>Coverage not available for this documentation-only update.</h1></body></html>" > public/coverage/index.html
        fi
      fi
  artifacts:
    paths:
      - public
  only:
    - develop-v2