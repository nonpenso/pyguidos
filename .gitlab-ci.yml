image: python:3.11-slim

stages:
  - test
  - deploy

cache:
  - key: pip-cache
    paths:
      - .pip-cache/
  - key: coverage-fixed-key 
    paths:
      - htmlcov/

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

# 1. Run Tests and calculate coverage
run_tests:
  stage: test
  tags:
    - shared-docker
  script:
    - apt-get update && apt-get install -y libexpat1 libgomp1
    - pip install --upgrade pip
    - pip install pytest pytest-cov ".[test]"
    - python -m pytest --cov=pyguidos tests/ --cov-report term-missing --cov-report html
  coverage: '/(?i)total.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)/'
  artifacts:
    when: always
    paths:
      - htmlcov/
    expire_in: 1 week
  only:
    refs:
      - develop-v2
      - main
    changes:
      - "pyguidos/**/*"
      - "tests/**/*"

# 2. Build and Deploy Documentation (GitLab Pages)
pages:
  stage: deploy
  tags:
    - shared-docker
  dependencies:
    - run_tests
  script:
    - apt-get update && apt-get install -y libexpat1
    - pip install --upgrade pip
    - pip install sphinx pydata-sphinx-theme .
    - sphinx-build -b html docs public
    - |
      if [ -d "htmlcov" ]; then
        echo "? Coverage data found. Deploying to public/coverage..."
        mkdir -p public/coverage
        cp -rf htmlcov/* public/coverage/
      else
        echo "? No coverage data found in workspace or cache."
        mkdir -p public/coverage
        echo "<html><body><h1>Coverage not yet generated. Please run a full pipeline.</h1></body></html>" > public/coverage/index.html
      fi
  artifacts:
    paths:
      - public
  only:
    - develop-v2
    - main